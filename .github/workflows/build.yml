# Builds the image and publishes it to the GitHub registry.
name: Build

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - prepare_vosk.py
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish
        run: |
          tag=$(cat Dockerfile prepare_vosk.py | sha256sum | cut -c1-12)
          # The image goes under the owner of this repository: GITHUB_TOKEN may write only to its own owner's packages.
          image=ghcr.io/${{ github.repository_owner }}/tts-base:$tag
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # BuildKit pushes the image itself. A plain "docker push" took a layer from an unrelated repository that
          # happened to be in the runner's cache, and the registry then refused the image.
          docker buildx create --use
          docker buildx build --provenance=false --sbom=false --push \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" -t "$image" .
          echo "Published $image" >> "$GITHUB_STEP_SUMMARY"
